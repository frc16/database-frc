services:

  mysql:
    image: mysql:8.0
    container_name: dam1-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dam1
      MYSQL_USER: dam1
      MYSQL_PASSWORD: dam1
      MYSQL_ROOT_PASSWORD: dam1
    ports:
      - "3309:3306"
    volumes:
      - dam1_mysqldata:/var/lib/mysql
      - ./sql/init_mysql.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  dam1_mysqldata: